name: Build e publicar APK

# O APK leva ~16 min e cada APK novo faz os celulares mostrarem o aviso de atualização, então ele NÃO sai a cada
# envio. Sai quando:
#   1) você roda manualmente: aba Ações > "Build e publicar APK" > Run workflow; ou
#   2) a mensagem do commit tem "[apk]" (ex.: "Corrige placar [apk]").
# O site continua publicando sozinho a cada envio (deploy-web.yml).
on:
  push:
    branches: [main]
    paths:
      - "kingbt/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # `needs:` só funciona entre jobs do MESMO workflow — ci.yml é um arquivo
  # separado e não bloqueia este. Sem este gate, um commit que quebra
  # typecheck/testes ainda gerava e publicava um APK normalmente.
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kingbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kingbt/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kingbt
    env:
      # Embutido no bundle JS para o app comparar sua própria versão com a
      # mais recente publicada (ver src/store/UpdateContext.tsx). Precisa
      # estar disponível em todos os passos, pois o bundle JS é gerado
      # dentro do "gradlew assembleRelease", não num passo isolado.
      EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Timestamp (epoch ms) deste build — usado junto com EXPO_PUBLIC_GIT_SHA
      # para a checagem de atualização obrigatória (ver src/store/UpdateContext.tsx
      # e /config/appVersion no Firestore). GITHUB_ENV persiste para os passos
      # seguintes, incluindo o "gradlew assembleRelease" que gera o bundle JS.
      - name: Definir timestamp do build
        run: echo "EXPO_PUBLIC_BUILD_TIME=$(date -u +%s%3N)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kingbt/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3 falhava com "Failed to find package 'tools'" — o pacote legado
      # 'tools' não é mais servido pelo Google, e v3 ainda pedia ele por
      # padrão. v4 removeu 'tools' do valor padrão de `packages` (só
      # platform-tools por default).
      - uses: android-actions/setup-android@v4

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android nativo (expo prebuild)
        run: npx expo prebuild --platform android --non-interactive

      - name: Definir versionCode/versionName do build
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"${APP_VERSION}\"/versionName \"${APP_VERSION}-${{ github.run_number }}\"/" android/app/build.gradle

      # `android/` é gerado do zero a cada run (expo prebuild), então o
      # debug.keystore embutido no template também é novo a cada build —
      # instalar um APK "por cima" do anterior sempre falhava por assinatura
      # divergente (o Android exige mesma assinatura para update-install).
      # Aqui usamos uma keystore de release FIXA (guardada como secret), a
      # mesma em todo build, para que atualizações instalem por cima normalmente.
      # É a mesma keystore (alias key0) usada nos builds manuais feitos pelo
      # Android Studio antes deste workflow existir — assim quem já tinha o
      # app instalado por esse caminho também consegue atualizar por cima.
      - name: Decodificar keystore de release
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Configurar assinatura de release no build.gradle
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/build.gradle";
            let content = fs.readFileSync(path, "utf8");
            const before = content;

            content = content.replace(
              "signingConfigs {\n        debug {",
              "signingConfigs {\n        release {\n            storeFile file(\"release.keystore\")\n            storePassword System.getenv(\"KINGBT_KEYSTORE_PASSWORD\")\n            keyAlias \"key0\"\n            keyPassword System.getenv(\"KINGBT_KEYSTORE_PASSWORD\")\n        }\n        debug {"
            );
            content = content.replace(
              "release {\n            // Caution! In production, you need to generate your own keystore file.\n            // see https://reactnative.dev/docs/signed-apk-android.\n            signingConfig signingConfigs.debug",
              "release {\n            // Caution! In production, you need to generate your own keystore file.\n            // see https://reactnative.dev/docs/signed-apk-android.\n            signingConfig signingConfigs.release"
            );

            if (content === before || !content.includes("signingConfigs.release") || !content.includes("release.keystore")) {
              console.error("Falha ao aplicar o patch de assinatura — o template do build.gradle gerado pelo expo prebuild mudou. Build interrompido para não publicar um APK assinado com chave de debug (efêmera) em silêncio.");
              process.exit(1);
            }
            fs.writeFileSync(path, content);
          '

      - name: Build APK release
        working-directory: kingbt/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KINGBT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Renomear APK
        # kingbt.apk (nome fixo) é o que o app baixa na atualização; KINGBT_<versão>.apk é a cópia com a versão no nome.
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk kingbt.apk
          cp kingbt.apk "KINGBT_${APP_VERSION}-${{ github.run_number }}.apk"

      # Versão deste APK, publicada junto com ele: o app compara o commit embutido no build com este
      # arquivo para avisar de atualização (ver src/store/UpdateContext.tsx).
      # O job roda DENTRO de kingbt/ (defaults.run.working-directory): aqui o caminho é relativo a ela
      # (apk-version.json), enquanto `files:` abaixo é relativo à raiz do repositório (kingbt/apk-version.json).
      - name: Gerar apk-version.json
        run: echo "{\"sha\":\"${{ github.sha }}\",\"build\":${{ github.run_number }}}" > apk-version.json

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "King BT (build ${{ github.run_number }})"
          body: "Build automático gerado a partir do commit ${{ github.sha }}."
          files: |
            kingbt/kingbt.apk
            kingbt/KINGBT_*.apk
            kingbt/apk-version.json
          make_latest: true
