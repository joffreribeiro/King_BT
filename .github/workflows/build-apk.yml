name: Build e publicar APK

on:
  push:
    branches: [main]
    paths:
      - "kingbt/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kingbt
    env:
      # Embutido no bundle JS para o app comparar sua própria versão com a
      # mais recente publicada (ver src/store/UpdateContext.tsx). Precisa
      # estar disponível em todos os passos, pois o bundle JS é gerado
      # dentro do "gradlew assembleRelease", não num passo isolado.
      EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Timestamp (epoch ms) deste build — usado junto com EXPO_PUBLIC_GIT_SHA
      # para a checagem de atualização obrigatória (ver src/store/UpdateContext.tsx
      # e /config/appVersion no Firestore). GITHUB_ENV persiste para os passos
      # seguintes, incluindo o "gradlew assembleRelease" que gera o bundle JS.
      - name: Definir timestamp do build
        run: echo "EXPO_PUBLIC_BUILD_TIME=$(date -u +%s%3N)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kingbt/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto Android nativo (expo prebuild)
        run: npx expo prebuild --platform android --non-interactive

      - name: Definir versionCode/versionName do build
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"${APP_VERSION}\"/versionName \"${APP_VERSION}-${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK release
        working-directory: kingbt/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk kingbt.apk

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "King BT (build ${{ github.run_number }})"
          body: "Build automático gerado a partir do commit ${{ github.sha }}."
          files: kingbt/kingbt.apk
          make_latest: true
