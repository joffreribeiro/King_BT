name: Publicar web (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - "kingbt/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Só leitura: o deploy usa o FIREBASE_TOKEN, não o token do GitHub.
permissions:
  contents: read

# Dois pushes seguidos não podem publicar fora de ordem (o build antigo sobrescrevendo o novo).
# Sem cancelar o que já está publicando: a regra do Firestore não deve ficar pela metade.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  # `needs:` só funciona entre jobs do MESMO workflow — não existe forma de
  # um job aqui esperar o resultado de ci.yml (arquivo diferente). Por isso
  # os checks rodam de novo aqui, como gate do próprio job `deploy`: um
  # commit que quebra typecheck/testes/regras não publica, mesmo que alguém
  # tenha ignorado o status do ci.yml no PR.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kingbt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kingbt/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

  rules-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kingbt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kingbt/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm ci

      - name: Testes de regras do Firestore (emulador)
        run: npm run test:rules

  deploy:
    needs: [check, rules-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # o GitHub emite um token OIDC de curta duração; o Google o troca por credencial do deploy
    defaults:
      run:
        working-directory: kingbt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kingbt/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Timestamp (epoch ms) deste build — usado pela checagem de atualização
      # obrigatória (ver src/store/UpdateContext.tsx e /config/appVersion no
      # Firestore). GITHUB_ENV persiste para o passo de export logo abaixo.
      - name: Definir timestamp do build
        run: echo "EXPO_PUBLIC_BUILD_TIME=$(date -u +%s%3N)" >> "$GITHUB_ENV"

      # SHA do commit publicado — usado junto com EXPO_PUBLIC_BUILD_TIME pela
      # checagem de atualização obrigatória. Antes só build-apk.yml definia
      # isso: no build web CURRENT_SHA ficava sempre null, e o aviso de
      # "nova versão" nunca aparecia na web (ver src/store/UpdateContext.tsx).
      - name: Definir SHA do build
        run: echo "EXPO_PUBLIC_GIT_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Exportar build web
        run: npx expo export --platform web

      # Versão publicada, lida pelo app instalado (APK) para avisar de atualização: sem token do GitHub,
      # sem Cloud Function (plano Blaze) e sem limite por IP. Ver src/store/UpdateContext.tsx.
      - name: Gerar version.json
        run: echo "{\"sha\":\"${{ github.sha }}\",\"buildTime\":${EXPO_PUBLIC_BUILD_TIME}}" > dist/version.json

      # firestore:rules vai junto: antes só o hosting era publicado aqui, então
      # uma correção em firestore.rules só ia ao ar se alguém lembrasse de
      # rodar `firebase deploy --only firestore:rules` manualmente. Os jobs
      # `check`/`rules-test` acima já validaram tudo antes deste passo rodar.
      # Sem chave nem token de longa duração: a identidade federada só vale para este repositório, na branch main.
      - name: Autenticar no Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Publicar no Firebase Hosting e nas regras do Firestore
        run: npx firebase-tools deploy --only hosting,firestore:rules --project king-bt-7f559
