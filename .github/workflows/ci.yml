name: CI

on:
  push:
    branches: [main]
  pull_request:

# Só leitura: este workflow roda testes, não precisa gravar nada no repositório.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kingbt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kingbt/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      # Só avisa: o código antigo ainda tem avisos (nenhum erro) e eles são limpos aos poucos.
      # Para virar obrigatório, basta tirar o continue-on-error.
      - name: Lint (só aviso)
        run: npm run lint
        continue-on-error: true

  # Testa firestore.rules contra o emulador: fecha as mesmas duas brechas de
  # segurança encontradas nesta auditoria (vinculação de perfil quebrada, e
  # /groupCodes listável para qualquer conta) e a race condition de placar
  # (last-write-wins). Sem este job, uma regra que reabrisse alguma dessas
  # brechas só seria detectada rodando os testes manualmente — como aconteceu
  # aqui, meses depois de introduzida.
  rules-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kingbt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kingbt/package-lock.json

      # firebase-tools 15.x recusa Java anterior a 21 (ver AGENTS.md).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm ci

      - name: Testes de regras do Firestore (emulador)
        run: npm run test:rules
